version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      test:
        patterns: ["xunit*", "AwesomeAssertions", "Microsoft.Testing.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
