name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build desktop app
        run: dotnet build AvaloniaApplication1/AvaloniaUI.Desktop/AvaloniaUI.Desktop.csproj -c Release
      - name: Test
        run: dotnet test RomManagerTests/RomManagerTests.csproj -c Release --logger trx
      - name: Check for pending EF model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project RomManagerShared
